services:
    postgres:
        image: postgres:17-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: ${DATABASE_NAME}
        ports:
            - "5433:5432"
        env_file:
            - .env
        volumes:
            - type: volume
              source: postgres_data
              target: /var/lib/postgresql/data
              volume:
                  nocopy: true
              read_only: false
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-U",
                    "${DATABASE_USER}",
                    "-d",
                    "${DATABASE_NAME}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: app
        ports:
            - "${PORT}:${PORT}"
        env_file:
            - .env
        environment:
            DATABASE_HOST: postgres
            DATABASE_PORT: 5432
            RAG_GRPC_URL: ${RAG_GRPC_URL:-host.docker.internal:50051}
            SUMMARY_GRPC_URL: ${SUMMARY_GRPC_URL:-host.docker.internal:50052}
        depends_on:
            postgres:
                condition: service_healthy
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped

volumes:
    postgres_data:

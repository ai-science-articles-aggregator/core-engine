[project]
name = "core-engine"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Денис Мовсумов", email = "damovsumov@edu.hse.ru"},
]
dependencies = [
    "fastapi>=0.124.4",
    "uvicorn>=0.38.0",
    "pydantic[email]>=2.12.5",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.45",
    "pydantic-settings>=2.12.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "authx>=1.4.3",
    "alembic>=1.17.2",
    "passlib[argon2]>=1.7.4",
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = {text = "MIT"}

[tool.basedpyright]
venvPath = "."
venv = ".venv"

typeCheckingMode = "standard"
